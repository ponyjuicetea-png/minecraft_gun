plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

version = '1.0.0'
group = 'dev.frontline'
base { archivesName = 'frontline-operations-1.20.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        client {
            workingDirectory project.file('dev-client')
            mods { frontline_ops { source sourceSets.main } }
            args '--username', 'FrontlineDev'
        }
        server {
            workingDirectory project.file('dev-server')
            mods { frontline_ops { source sourceSets.main } }
            args '--nogui'
        }
    }
}

repositories { flatDir { dirs '.cache/devlibs' } }
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.10'
    runtimeOnly fg.deobf('localmods:tacz:1.1.8-hotfix2')
    runtimeOnly fg.deobf('localmods:tacznpcs:1.0.3-craftorio')
    runtimeOnly fg.deobf('localmods:smartbrainlib:1.15')
    runtimeOnly fg.deobf('localmods:playeranimator:1.0.2')
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
jar {
    manifest { attributes 'Specification-Title': 'frontline_ops', 'Specification-Version': '1',
        'Implementation-Title': 'Frontline Operations', 'Implementation-Version': project.version }
    finalizedBy 'reobfJar'
}
